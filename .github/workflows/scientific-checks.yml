name: Finite scientific checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-fixture-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Prepare isolated Python environment
        run: |
          command -v go
          python -m venv "$RUNNER_TEMP/scopequorum-env"
          "$RUNNER_TEMP/scopequorum-env/bin/python" -m pip install --only-binary=:all: -r requirements.txt
      - name: Run finite models and owned loopback fixtures
        timeout-minutes: 27
        run: |
          timeout --signal=TERM --kill-after=10s 1500s "$RUNNER_TEMP/scopequorum-env/bin/python" -B src/scientific_checks.py --output "$RUNNER_TEMP/scopequorum-checks-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Check request-local status folding against finite independent references
        run: |
          "$RUNNER_TEMP/scopequorum-env/bin/python" -B tests/cost_choice_regression.py
          "$RUNNER_TEMP/scopequorum-env/bin/python" -B -O tests/cost_choice_regression.py
      - name: Check request-local status folding and retain finite reference logs
        run: |
          timeout 30s "$RUNNER_TEMP/scopequorum-env/bin/python" -B tests/status_fold_regression.py > "$RUNNER_TEMP/scopequorum-status-fold-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log" 2>&1
      - name: Check incremental TCP history and durable restart
        run: |
          timeout --signal=TERM --kill-after=10s 180s "$RUNNER_TEMP/scopequorum-env/bin/python" -B -m unittest discover -s tests -p test_witness_sync.py -v > "$RUNNER_TEMP/scopequorum-incremental-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log" 2>&1
      - name: Validate the quick gate against current executed test inventory
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 240s "$RUNNER_TEMP/scopequorum-env/bin/python" -B src/verify_artifact.py --output "$RUNNER_TEMP/scopequorum-quick-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > "$RUNNER_TEMP/scopequorum-quick-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log" 2>&1
      - name: Reproduce two-plane witnessed reads and validate accounting
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/scopequorum-env/bin/python"
          output="$RUNNER_TEMP/scopequorum-reads-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          timeout --signal=TERM --kill-after=10s 420s "$python" -B src/witness_read_study.py --output "$output" > "$RUNNER_TEMP/scopequorum-reads-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log" 2>&1
          "$python" -B src/witness_read_report.py --source "$output" --output "$output-accounting" --generated "$output-generated" > "$RUNNER_TEMP/scopequorum-reads-accounting-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log" 2>&1
      - name: Validate dependency reads across durable witness recovery
        timeout-minutes: 3
        run: |
          timeout --signal=TERM --kill-after=10s 150s "$RUNNER_TEMP/scopequorum-env/bin/python" -B src/durable_read_study.py --output "$RUNNER_TEMP/scopequorum-durable-root-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Upload raw observations even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scopequorum-scientific-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/scopequorum-durable-root-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/scopequorum-status-fold-${{ github.run_id }}-${{ github.run_attempt }}.log
            ${{ runner.temp }}/scopequorum-incremental-${{ github.run_id }}-${{ github.run_attempt }}.log
            ${{ runner.temp }}/scopequorum-quick-${{ github.run_id }}-${{ github.run_attempt }}.log
            ${{ runner.temp }}/scopequorum-quick-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/scopequorum-reads-${{ github.run_id }}-${{ github.run_attempt }}.log
            ${{ runner.temp }}/scopequorum-reads-accounting-${{ github.run_id }}-${{ github.run_attempt }}.log
            ${{ runner.temp }}/scopequorum-reads-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/scopequorum-reads-${{ github.run_id }}-${{ github.run_attempt }}-accounting/
            ${{ runner.temp }}/scopequorum-reads-${{ github.run_id }}-${{ github.run_attempt }}-generated/
            ${{ runner.temp }}/scopequorum-checks-${{ github.run_id }}-${{ github.run_attempt }}/
            !${{ runner.temp }}/scopequorum-checks-${{ github.run_id }}-${{ github.run_attempt }}/tmp/
          if-no-files-found: error
          retention-days: 30
